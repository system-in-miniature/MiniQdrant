site_name: MiniQdrant Tutorial
site_description: A chapter-based guide to MiniQdrant and the Qdrant mechanisms it models
site_url: https://system-in-miniature.github.io/mini-qdrant/
repo_url: https://github.com/system-in-miniature/mini-qdrant
repo_name: system-in-miniature/mini-qdrant
docs_dir: docs

theme:
  name: material
  logo: assets/brand/avatar.svg
  favicon: assets/brand/avatar.svg
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - English:
      - "Book Contents": tutorial/index.md
      - Tutorial:
          - "1 · Meet MiniQdrant": tutorial/01-getting-started.md
          - "2 · Points, Payloads, and Distance": tutorial/02-points-payload.md
          - "3 · WAL and Manifest Publication": tutorial/03-wal-manifest.md
          - "4 · The Segment Lifecycle": tutorial/04-segments.md
          - "5 · HNSW from Layers to Pruning": tutorial/05-hnsw.md
          - "6 · Filtering": tutorial/06-filtering.md
          - "7 · Query Planning": tutorial/07-planner.md
          - "8 · Quantization": tutorial/08-quantization.md
          - "9 · Online Optimization": tutorial/09-optimizer.md
          - "10 · Snapshots and Methodology": tutorial/10-snapshots-methodology.md
      - Reference:
          - "Architecture": architecture.md
          - "Qdrant Mapping": qdrant-mapping.md
          - "Hands-on Labs": labs-guide.md
          - "Differences from Qdrant": differences.md
          - "Storage Format": storage-format.md
          - "Behavior Matrix": behavior-matrix.md
          - "Design History Archive": superpowers/README.md
  - 简体中文:
      - "全书目录": zh/tutorial/index.md
      - 教程:
          - "1 · 认识 MiniQdrant": zh/tutorial/01-getting-started.md
          - "2 · 点与负载": zh/tutorial/02-points-payload.md
          - "3 · WAL 与清单": zh/tutorial/03-wal-manifest.md
          - "4 · 段生命周期": zh/tutorial/04-segments.md
          - "5 · HNSW": zh/tutorial/05-hnsw.md
          - "6 · 过滤": zh/tutorial/06-filtering.md
          - "7 · 查询规划": zh/tutorial/07-planner.md
          - "8 · 量化": zh/tutorial/08-quantization.md
          - "9 · 在线优化": zh/tutorial/09-optimizer.md
          - "10 · 快照与方法论": zh/tutorial/10-snapshots-methodology.md
      - 参考资料:
          - "快速开始": zh/index.md
          - "架构总览": zh/ARCHITECTURE.md
          - "Qdrant 映射": zh/qdrant-mapping.md
          - "动手实验": zh/labs-guide.md
          - "与 Qdrant 的差异": zh/DIFFERENCES_FROM_QDRANT.md
          - "存储格式": zh/storage-format.md
          - "行为矩阵": zh/behavior-matrix.md
          - "Superpowers 设计存档": superpowers/README.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences

strict: true
